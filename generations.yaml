generations:
  - name: "First Generation"
    start_year: 2023
    end_year: 2024
    description: "The Cadillac LYRIQ is Cadillac's first all-electric vehicle, built on GM's BEV3 platform. Production began in May 2022 with the 2023 model year. The initial launch configuration features a single rear-mounted electric motor producing 340 HP and 325 lb-ft of torque. The 102 kWh Ultium battery pack delivers an EPA-estimated range of 312-314 miles in rear-wheel drive form. For the 2024 model year, a dual-motor all-wheel drive version became available with approximately 500 HP output. The exterior design features a distinctive black crystal grille with illuminated elements, ultra-thin vertical LED headlights and taillights, and a fastback-like profile. A more conventional door access system with remote-activated flush pop-out handles was introduced for 2024. Inside, the cabin showcases a minimalist luxury aesthetic dominated by a 33-inch curved LED display integrating the instrument cluster and infotainment system. Advanced technology includes Super Cruise hands-free driving capability and up to 190 kW DC fast charging."

  - name: "First Generation (2025 Refresh)"
    start_year: 2025
    end_year: null
    description: "The 2025 Cadillac LYRIQ receives a comprehensive refresh while maintaining the BEV3 platform foundation. The base Tech trim level was dropped, and the model is redesigned with 24% fewer parts. Power output increases to 365 HP for rear-wheel drive (up from 340 HP) and 515 HP for all-wheel drive (up from 500 HP). EPA-estimated range increases to 326 miles for rear-wheel drive models. The Velocity Package, a $1,200 OTA update, increases torque output further and reduces 0-60 times from 4.7 to 4.4 seconds for dual-motor models. In January 2025, Cadillac introduced the high-performance Lyriq-V variant as a 2026 model, featuring 615 HP and accelerating from 0-60 mph in 3.3 seconds, though with a slightly reduced EPA-estimated range of 285 miles."
